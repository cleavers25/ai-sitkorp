# AI Infrastructure & Website Security Assistant — Phase 1
# Only the reverse proxy publishes ports; postgres/redis/api/web stay on the internal network.

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiinfra}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aiinfra}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?set SECRET_MASTER_KEY in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUST_PROXY_HEADERS: "true"
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  APP_BASE_URL: ${APP_BASE_URL:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiinfra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiinfra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build: ./apps/api
    restart: unless-stopped
    command: ["api"]
    environment: *api-env
    volumes:
      - backups:/backups  # read for downloads (ADMIN only)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["worker"]
    environment: *api-env
    volumes:
      - backups:/backups  # website backups are written here (back this volume up off-site)
    depends_on:
      api: { condition: service_healthy }

  # Celery Beat: emits a one-minute heartbeat; the schedules themselves live in the database
  # (menu "Jadwal"). Run exactly one instance.
  scheduler:
    build: ./apps/api
    restart: unless-stopped
    command: ["scheduler"]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # Plain-HTTP origin for a reverse proxy on this host (e.g. Cloudflare Tunnel
      # -> http://127.0.0.1:8085); loopback only, not reachable from the LAN.
      - "127.0.0.1:8085:8085"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
      - web

volumes:
  backups:
  pgdata:
  redisdata:
  caddydata:
